<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mail-hub · 统一邮箱管理</title>
    <!-- 站点图标：与页头 logo 同一个信箱字形。图标文件本身按视觉基线 §9 另走候选流程，这里只引用。
         没有这几行时浏览器会给默认的小地球。PNG 版本给 iOS「添加到主屏幕」用。 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 浏览器标签栏底色跟页面底色走（视觉基线 v1 的 --bg） -->
    <meta name="theme-color" content="#FDFDFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
    <script>
      // pre-paint：在首屏前定主题，避免亮/暗闪烁。?theme=dark|light 可强制覆盖（可分享链接）。
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'dark' || q === 'light') localStorage.setItem('theme', q);
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
